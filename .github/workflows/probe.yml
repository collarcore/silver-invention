name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: |
          UA='lv2026-tracker (+https://github.com/collarcore/silver-invention)'
          B=https://www.dvk-rs.si/arhivi/volitve2022/lv2022/data
          mkdir -p ref
          for id in 061 043 203 001; do curl -s -A "$UA" -o ref/2022_izvoz_$id.xlsx "$B/obcine-xlsx/izvoz_$id.xlsx"; done
          curl -s -A "$UA" -o ref/2022_ostale_obcine.csv "$B/ostale_obcine.csv"
          curl -s -A "$UA" -o ref/2022_mestne_obcine.csv "$B/mestne_obcine.csv"
          curl -s -A "$UA" -o ref/2022_drugi_krog.csv "$B/drugi_krog.csv"
          ls -la ref
          node scripts/fetch.js --base "$B/obcine-xlsx/izvoz_" --out ref/2022.json || true
          git config user.name "lv2026-zajem"
          git config user.email "actions@users.noreply.github.com"
          git add ref && git commit -q -m "ref: 2022 archive sample" && git pull -q --rebase origin main && git push -q
