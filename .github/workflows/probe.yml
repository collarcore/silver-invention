name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='lv2026-tracker (+https://github.com/collarcore/silver-invention)'
          B=https://volitve.dvk-rs.si/dz2026
          mkdir -p ref/dz2026
          curl -s -A "$UA" "$B/config/config.json" -o ref/dz2026/config.json; cat ref/dz2026/config.json
          for f in data.json rezultati.json liste.json; do curl -s -A "$UA" "$B/data/$f" -o ref/dz2026/$f; done
          ls -la ref/dz2026
          git config user.name "lv2026-zajem"; git config user.email "actions@users.noreply.github.com"
          git add ref/dz2026 && git commit -q -m "ref: DZ 2026 results" && git pull -q --rebase origin main && git push -q
