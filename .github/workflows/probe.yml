name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: |
          UA='lv2026-tracker (+https://github.com/collarcore/silver-invention)'
          B=https://www.dvk-rs.si/arhivi/volitve2022/lv2022/data
          mkdir -p ref
          for id in 011 052; do curl -s -A "$UA" -o ref/2022_k2_izvoz_$id.xlsx "$B/obcine-xlsx/izvoz_$id.xlsx"; curl -s -A "$UA" -o ref/2022_k1_izvoz_$id.xlsx -w "%{http_code} k1 $id\n" "$B/prvikrog/obcine-xlsx/izvoz_$id.xlsx"; done
          curl -s -A "$UA" -o /dev/null -w "%{http_code} prvikrog/data.json\n" "$B/prvikrog/data.json"
          node scripts/fetch.js --base "$B/prvikrog/obcine-xlsx/izvoz_" --out ref/2022_k1.json || true
          git config user.name "lv2026-zajem"
          git config user.email "actions@users.noreply.github.com"
          git add ref && git commit -q -m "ref: 2022 first-round archive" && git pull -q --rebase origin main && git push -q
