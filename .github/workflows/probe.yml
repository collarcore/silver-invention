name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: |
          # replay 2022: start from the first-round data, then read the final 2022 exports, where runoff municipalities carry only the runoff
          cp ref/2022_k1.json /tmp/d.json
          node scripts/fetch.js --base https://www.dvk-rs.si/arhivi/volitve2022/lv2022/data/obcine-xlsx/izvoz_ --out /tmp/d.json
          mkdir -p ref/test && cp /tmp/d.json ref/test/replay2022.json
          git config user.name "lv2026-zajem"; git config user.email "actions@users.noreply.github.com"
          git add ref/test && git commit -q -m "test: 2022 runoff replay" && git pull -q --rebase origin main && git push -q
