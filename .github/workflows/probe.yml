name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: |
          for id in 061 043; do curl -s -A 'lv2026-tracker (+https://github.com/collarcore/silver-invention)' -o /tmp/i$id.xlsx "https://volitve.dvk-rs.si/lv2026/data/obcine-xlsx/izvoz_$id.xlsx"; done
          node -e "
          const X=require('xlsx');for(const id of ['061','043']){const wb=X.readFile('/tmp/i'+id+'.xlsx');console.log('##',id,wb.SheetNames.join(' | '));
          for(const sn of wb.SheetNames.slice(0,2)){const a=X.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null});console.log('--',sn);a.slice(0,22).forEach((r,i)=>console.log(i,JSON.stringify(r.slice(0,9))))}}"
