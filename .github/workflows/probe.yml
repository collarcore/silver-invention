name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='lv2026-tracker (+https://github.com/collarcore/silver-invention)'
          B=https://volitve.dvk-rs.si/dz2026/data
          for f in volisca_01_01.json volisca_1_1.json volisca_1001.json; do echo "-- $f $(curl -s -A "$UA" -o /tmp/v -w '%{http_code} %{size_download}' "$B/$f")"; head -c 900 /tmp/v | tr -c '[:print:]\n' '.'; echo; done
          mkdir -p ref/dz2026/v
          for e in 1 2 3 4 5 6 7 8; do for o in 01 02 03 04 05 06 07 08 09 10 11; do f=$(printf 'volisca_%02d_%s.json' $e $o); c=$(curl -s -A "$UA" -o ref/dz2026/v/$f -w '%{http_code}' "$B/$f"); [ "$c" = 200 ] || rm -f ref/dz2026/v/$f; done; done
          ls ref/dz2026/v | wc -l; du -sh ref/dz2026/v
          git config user.name "lv2026-zajem"; git config user.email "actions@users.noreply.github.com"
          git add ref/dz2026 && git commit -q -m "ref: DZ 2026 polling-station results" && git pull -q --rebase origin main && git push -q || true
