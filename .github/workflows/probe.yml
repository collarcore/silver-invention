name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA='lv2026-tracker (+https://github.com/collarcore/silver-invention)'
          for u in arhivi/volitve2022/lv2022/config/config.json arhivi/volitve2022/lv2022/data/ostale_obcine.csv arhivi/volitve2022/lv2022/data/mestne_obcine.csv arhivi/volitve2022/lv2022/data/obcine-xlsx/izvoz_061.xlsx arhivi/volitve2022/lv2022/data/obcine-data/ljubljana.json arhivi/volitve2022/lv2022/data/obcine-press/obcina_ljubljana.csv arhivi/volitve2022/lv2022/data/data.json; do
            code=$(curl -s -A "$UA" -o /tmp/f -w '%{http_code} %{size_download} %{content_type}' "https://www.dvk-rs.si/$u"); echo "== $u -> $code"; head -c 1500 /tmp/f | tr -c '[:print:]\n' '.' ; echo
          done
          curl -s -A "$UA" "https://volitve.dvk-rs.si/lv2026/config/config.json"
